<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speed Test</title>
<meta name="description" content="Open source internet speed test — download, upload, ping, jitter.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <header class="top">
    <h1>Speed Test</h1>
    <select id="serverSel" aria-label="Server"></select>
  </header>

  <section class="card">
    <div class="gauge">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="84"/>
        <circle id="gaugeArc" class="arc" cx="100" cy="100" r="84"/>
      </svg>
      <div class="gauge-txt">
        <span id="bigVal">0.00</span>
        <small>Mbps</small>
        <em id="bigLabel">Ready</em>
      </div>
    </div>

    <div class="bar"><i id="bar"></i></div>

    <div class="grid">
      <div><span>Download</span><b id="dlVal">--</b><small>Mbps</small></div>
      <div><span>Upload</span><b id="ulVal">--</b><small>Mbps</small></div>
      <div><span>Ping</span><b id="pingVal">--</b><small>ms</small></div>
      <div><span>Jitter</span><b id="jitVal">--</b><small>ms</small></div>
    </div>

    <button id="btn" class="btn">Start</button>

    <div class="meta">
      <div><span>Server</span><b id="serverName">Auto</b><i id="serverGeo"></i></div>
      <div><span>IP</span><b id="ipVal">--</b></div>
      <div><span>ISP</span><b id="ispVal">--</b></div>
    </div>

    <div class="share" id="shareRow" hidden>
      <button id="copyBtn" class="link">Copy result</button>
    </div>
  </section>

  <footer>
    <a href="https://github.com/huvantiofficial-code/Wifi-Checker-Open-Source-" target="_blank" rel="noopener">Source</a>
  </footer>
</main>

<script src="servers.js"></script>
<script src="app.js"></script>
</body>
</html>
