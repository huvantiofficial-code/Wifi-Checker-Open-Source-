<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
<title>Speed Test</title>
<meta name="description" content="Test your internet download speed, upload speed, ping, and jitter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient ambient-one" aria-hidden="true"></div>
<div class="ambient ambient-two" aria-hidden="true"></div>

<main class="wrap">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5.2 9.8a10 10 0 0 1 13.6 0M8.3 13a5.6 5.6 0 0 1 7.4 0M11 16.3a1.45 1.45 0 1 1 2 2.1 1.45 1.45 0 0 1-2-2.1Z"/></svg>
      </span>
      <h1>Speed Test</h1>
    </div>

    <div class="server-picker">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-11A6 6 0 1 0 6 10c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2.1"/></svg>
      <select id="serverSel" aria-label="Select test server"></select>
      <svg class="chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
    </div>
  </header>

  <section class="card" id="testCard" data-phase="ready" aria-busy="false">
    <div class="test-layout">
      <div class="gauge-panel">
        <div class="gauge">
          <span class="gauge-glow" aria-hidden="true"></span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="speedGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7868ff"/>
                <stop offset=".48" stop-color="#4d8dff"/>
                <stop offset="1" stop-color="#22c7ea"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="100" cy="100" r="84"/>
            <circle id="gaugeArc" class="arc" cx="100" cy="100" r="84"/>
          </svg>
          <div class="gauge-txt" aria-live="polite">
            <span id="bigVal">0.00</span>
            <small>Mbps</small>
            <em><i></i><span id="bigLabel">Ready</span></em>
          </div>
        </div>
      </div>

      <div class="control-panel">
        <div class="grid">
          <div class="metric metric-download">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
            </span>
            <span class="metric-label">Download</span>
            <p><b id="dlVal">--</b><small>Mbps</small></p>
          </div>
          <div class="metric metric-upload">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 16V5m0 0 4 4m-4-4L8 9M5 20h14"/></svg>
            </span>
            <span class="metric-label">Upload</span>
            <p><b id="ulVal">--</b><small>Mbps</small></p>
          </div>
          <div class="metric metric-ping">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 12h3l2.1-5 4 10 2-5H20"/></svg>
            </span>
            <span class="metric-label">Ping</span>
            <p><b id="pingVal">--</b><small>ms</small></p>
          </div>
          <div class="metric metric-jitter">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 15.5c2.7 0 2.7-7 5.3-7s2.7 7 5.4 7 2.6-7 5.3-7"/></svg>
            </span>
            <span class="metric-label">Jitter</span>
            <p><b id="jitVal">--</b><small>ms</small></p>
          </div>
        </div>

        <div class="bar" role="progressbar" aria-label="Test progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>

        <button id="btn" class="btn" type="button">Start</button>

        <div class="share" id="shareRow" hidden>
          <button id="copyBtn" class="link" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
            <span id="copyLabel">Copy result</span>
          </button>
        </div>
      </div>
    </div>

    <div class="meta">
      <div class="meta-item">
        <span class="meta-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></svg>
        </span>
        <p><span>Server</span><b id="serverName">Auto</b><i id="serverGeo"></i></p>
      </div>
      <div class="meta-item">
        <span class="meta-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a13 13 0 0 1 0 16M12 4a13 13 0 0 0 0 16"/></svg>
        </span>
        <p><span>IP address</span><b id="ipVal">--</b></p>
      </div>
      <div class="meta-item">
        <span class="meta-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 18.5v-3m4 3v-6m4 6v-9m4 9v-13"/><path d="M4 21h16"/></svg>
        </span>
        <p><span>Provider</span><b id="ispVal">--</b></p>
      </div>
    </div>
  </section>
</main>

<script src="servers.js"></script>
<script src="app.js"></script>
</body>
</html>
